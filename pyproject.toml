[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mechagnome"
version = "0.1.0"
description = "An experimental metaprogrammable agent with a persistent dynamic toolbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.3.0",
    "textual>=1.0",
    "textual-image[textual]>=0.8.5,<0.9",
]
license = "MIT"
authors = [{name = "Eric Tramel"}]

[project.scripts]
mechagnome = "mechagnome.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mechagnome"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
